name: Публикуване в GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Изтегляне на проекта
        uses: actions/checkout@v4

      - name: Настройване на Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Инсталиране
        run: npm ci

      - name: Проверка
        run: npm run typecheck

      - name: Създаване на сайта
        run: npm run build

      - name: Настройване на GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовка на готовия сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Публикуване
        id: deployment
        uses: actions/deploy-pages@v4
